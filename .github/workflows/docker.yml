name: Docker checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  build-and-smoke-test:
    name: Build + run + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Compute daily cache-bust value
        id: cachebust
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Load the image into the local daemon so the next steps can run it:
      # a successful build alone doesn't prove nginx starts and serves the site.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hullpatch:ci
          build-args: |
            CACHE_BUST=${{ steps.cachebust.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same hardening as docker-compose.yml, so a config that needs a writable
      # filesystem or extra privileges fails here rather than in production.
      - name: Run container
        run: |
          docker run -d --name smoke-test -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            hullpatch:ci

      - name: Wait for the site to respond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/healthz; then
              echo "Site responded after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Site never responded within 30s"
          docker logs smoke-test
          exit 1

      - name: Check the page, the viewer's WASM and the headers
        run: |
          fail() { echo "$1"; docker logs smoke-test; exit 1; }
          page=$(curl -fsS http://localhost:8080/) || fail "GET / failed"
          echo "$page" | grep -q "HULLPATCH" || fail "GET / did not return the Hullpatch page"
          curl -fsSI http://localhost:8080/ | grep -qi "^content-security-policy:" || fail "missing Content-Security-Policy header"

          # F3D's viewer only compiles if the WASM is served as application/wasm.
          wasm_path=$(docker exec smoke-test sh -c 'ls /usr/share/nginx/html/assets/*.wasm' | head -1 | sed 's#/usr/share/nginx/html##')
          [ -n "$wasm_path" ] || fail "no .wasm file in the image"
          type=$(curl -fsSI "http://localhost:8080${wasm_path}" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          [ "$type" = "application/wasm" ] || fail "WASM served as '$type', expected application/wasm"
          enc=$(curl -fsSI -H 'Accept-Encoding: gzip' "http://localhost:8080${wasm_path}" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding"{print $2}')
          [ "$enc" = "gzip" ] || fail "WASM not gzip-compressed"
          # The web app manifest needs its own type (nginx's mime.types lacks it).
          mtype=$(curl -fsSI http://localhost:8080/site.webmanifest | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          [ "$mtype" = "application/manifest+json" ] || fail "manifest served as '$mtype', expected application/manifest+json"
          # ...without changing any other file's type.
          itype=$(curl -fsSI http://localhost:8080/favicon.ico | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          [ "$itype" = "image/x-icon" ] || fail "favicon served as '$itype', expected image/x-icon"
          # The service worker must be served as JavaScript and never cached by the browser.
          sw_headers=$(curl -fsSI http://localhost:8080/sw.js | tr -d '\r') || fail "GET /sw.js failed"
          echo "$sw_headers" | grep -qi '^content-type: .*javascript' || fail "sw.js not served as JavaScript"
          echo "$sw_headers" | grep -qi '^cache-control: no-cache' || fail "sw.js missing Cache-Control: no-cache"
          # Shares that arrive before the service worker runs land on the page.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/share-target)
          [ "$code" = "303" ] || fail "POST /share-target returned $code, expected 303"
          echo "Page, CSP header, WASM ($wasm_path, $type, $enc), manifest ($mtype), sw.js and share target all OK"

      - name: Stop container
        if: always()
        run: docker rm -f smoke-test

  trivy:
    name: Scan image for vulnerabilities
    runs-on: ubuntu-latest
    needs: build-and-smoke-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Compute daily cache-bust value
        id: cachebust
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hullpatch:ci
          build-args: |
            CACHE_BUST=${{ steps.cachebust.outputs.date }}
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hullpatch:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
