# Hullpatch: static site. The repair runs in the visitor's browser, so the
# server only hands out files; nothing is ever uploaded to it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # application/wasm matters most: F3D's viewer is 43 MB raw, ~12 MB gzipped.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm text/plain;

    # Liveness probe for Docker's HEALTHCHECK and the CI smoke test.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in every asset name, so they never change.
    location /assets/ {
        include /etc/nginx/hullpatch-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # nginx's mime.types has no entry for .webmanifest. The empty types block is
    # scoped to this one file, so default_type applies here and nowhere else.
    location = /site.webmanifest {
        include /etc/nginx/hullpatch-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Files shared to the installed app are POSTed here and caught by the service
    # worker. If it isn't running yet, open the app instead of showing an error.
    location = /share-target {
        include /etc/nginx/hullpatch-headers.conf;
        return 303 /;
    }

    location / {
        include /etc/nginx/hullpatch-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
