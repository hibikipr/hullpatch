# Included in every location: nginx drops server-level add_header lines in any
# location that sets its own, so the headers live here instead.
#
# CSP notes:
#   'wasm-unsafe-eval'  compiling F3D's WebAssembly viewer
#   'unsafe-eval'       F3D's Emscripten bindings build functions with `new Function`;
#                       without it the 3D view fails and the page falls back to pictures
#   'unsafe-inline' (styles only)  per-card colour variables in index.html
#   blob:/data:         the download link, preview pictures and worker transfers
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
