# Example for Nginx Proxy Manager: Proxy Host for the Hullpatch site -> "Custom locations"
# -> Add location. Set the location to /api/, scheme http, forward host hullpatch-api,
# port 8081, then paste the directives below into that location's gear icon (advanced
# config). Equivalent plain nginx:
#
#   location /api/ {
#       proxy_pass http://hullpatch-api:8081;
#       ...the directives below...
#   }
#
# IMPORTANT: this location must NOT include the tinyauth forward-auth lines
# (auth_request / error_page 401 redirect) that protect the rest of the site. Scripts
# can't do an interactive sign-in; the API key (Authorization: Bearer) is the gate.
# If tinyauth is enforced for the whole host instead, add the API to its allowed
# paths with the regex  ^/api/  so those requests skip the sign-in.

# STLs up to 150 MB (the API itself caps at HULLPATCH_API_MAX_BYTES).
client_max_body_size 160m;

# Stream the upload straight to the API instead of spooling it to disk first.
proxy_request_buffering off;

# Repairing a big mesh can take minutes.
proxy_read_timeout 300s;
proxy_send_timeout 300s;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
