<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#070a18">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/michroma-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/chakra-petch-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/townsville.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Hullpatch docs home">
    <img class="mark" src="{{ '/assets/mark-72.png' | relative_url }}" width="36" height="36" alt="">
    HULLPATCH <span class="tv">/ docs</span>
  </a>
  <nav class="site-nav" aria-label="Docs">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/api.html' | relative_url }}"{% if page.url == '/api.html' %} aria-current="page"{% endif %}>API</a>
    <a href="{{ '/openapi.yaml' | relative_url }}">OpenAPI</a>
    <a href="https://github.com/hibikipr/hullpatch">GitHub</a>
  </nav>
</div></header>

<main class="wrap doc{% if page.url == '/api.html' %} doc-api{% endif %}">
  <div class="kicker">{% if page.url == '/api.html' %}Reference · HTTP API v1{% else %}STL and 3MF repair · docs{% endif %}</div>
  {{ content }}
</main>

<footer class="site-footer"><div class="wrap">
  <span>HULLPATCH · part of <a href="https://townsville.cc">townsville<span class="dotcc">.cc</span></a></span>
  <span>AGPL-3.0 · <a href="https://github.com/hibikipr/hullpatch">source</a></span>
</div></footer>
</body>
</html>
