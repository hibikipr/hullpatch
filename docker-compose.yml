services:
  hullpatch:
    image: ghcr.io/hibikipr/hullpatch:latest
    # Or build from this checkout instead:
    # build: .
    container_name: hullpatch
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Stateless: no volumes or settings needed. Files are repaired in the
    # visitor's browser and never reach the container.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional HTTP API for scripts (POST an STL, get the repaired STL back).
  # Unlike the site above, files DO reach this container and are repaired in memory
  # on the server. Put one API key per line in ./api-keys.txt (gitignored).
  hullpatch-api:
    image: ghcr.io/hibikipr/hullpatch-api:latest
    # Or build from this checkout instead:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.api
    container_name: hullpatch-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      HULLPATCH_API_KEYS_FILE: /run/secrets/hullpatch_api_keys
      # Or inline, comma-separated: HULLPATCH_API_KEYS: "key-one,key-two"
      # HULLPATCH_API_CONCURRENCY: 2   # repairs running at once
      # HULLPATCH_API_QUEUE: 4         # further requests allowed to wait
    secrets:
      - hullpatch_api_keys
    # Everything stays in memory: no volumes.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A 150 MB mesh can need around 2 GB while it is repaired, per concurrent job.
    # Uncomment to cap it (lower HULLPATCH_API_CONCURRENCY if you set this low):
    # mem_limit: 4g

secrets:
  hullpatch_api_keys:
    file: ./api-keys.txt
